<script>
(function () {
    "use strict";

    var lines = [];
    var passed = 0, failed = 0;
    function log(s) { lines.push(s); }
    function pass(s) { passed++; lines.push("PASS " + s); }
    function fail(s) { failed++; lines.push("FAIL " + s); }
    function render() {
        lines.push("");
        lines.push("==================================================");
        lines.push((failed === 0 ? "ALL TESTS PASSED" : "TESTS FAILED") +
            "  (" + passed + " passed, " + failed + " failed)");
        document.getElementById("out").textContent = lines.join("\n");
    }

    function run() {
        if (!window.ShowdownParser || typeof window.ShowdownParser.parseTeam !== "function") {
            fail("showdown_parser.js did not register window.ShowdownParser");
            render();
            return;
        }
        if (!window.DataSource || typeof window.DataSource.pokemonSlug !== "function") {
            fail("datasource.js did not register window.DataSource");
            render();
            return;
        }

        var fixtures = JSON.parse(document.getElementById("fixtures").textContent);
        var slugs = JSON.parse(document.getElementById("slugs").textContent);

        // --- parser equivalence -------------------------------------------
        fixtures.forEach(function (fixture) {
            var actual;
            try {
                actual = window.ShowdownParser.parseTeam(fixture.input);
            } catch (err) {
                actual = { error: err.message };
            }
            var a = JSON.stringify(actual);
            var b = JSON.stringify(fixture.expected);
            if (a === b) {
                pass("parseTeam: " + fixture.label);
            } else {
                fail("parseTeam: " + fixture.label);
                log("       expected: " + b);
                log("       actual:   " + a);
            }
        });

        // --- slug equivalence ---------------------------------------------
        slugs.forEach(function (pair) {
            var actual = window.DataSource.pokemonSlug(pair[0]);
            if (actual === pair[1]) {
                pass("pokemonSlug(" + JSON.stringify(pair[0]) + ") === " + JSON.stringify(pair[1]));
            } else {
                fail("pokemonSlug(" + JSON.stringify(pair[0]) + ") expected " +
                    JSON.stringify(pair[1]) + " but got " + JSON.stringify(actual));
            }
        });

        // --- paste id extraction (mirrors pokepaste_api.extract_paste_id) --
        var validId = "2e5d1e831c6d9e4c";
        [
            validId,
            "https://pokepast.es/" + validId,
            "pokepast.es/" + validId,
            "https://pokepast.es/" + validId + "/raw",
            "  https://pokepast.es/" + validId + "  ",
        ].forEach(function (value) {
            try {
                var got = window.DataSource.extractPasteId(value);
                if (got === validId) pass("extractPasteId(" + JSON.stringify(value) + ")");
                else fail("extractPasteId(" + JSON.stringify(value) + ") got " + got);
            } catch (err) {
                fail("extractPasteId(" + JSON.stringify(value) + ") threw " + err.message);
            }
        });
        ["", "   ", "../etc/passwd", "https://pokepast.es/nothex!!",
         "https://pokepast.es/abc", "zzzzzzzz"].forEach(function (value) {
            try {
                window.DataSource.extractPasteId(value);
                fail("extractPasteId(" + JSON.stringify(value) + ") should have thrown");
            } catch (err) {
                pass("extractPasteId rejects " + JSON.stringify(value));
            }
        });

        render();
    }

    try {
        run();
    } catch (err) {
        fail("unexpected exception: " + (err && err.stack ? err.stack : err));
        render();
    }
})();
</script>
